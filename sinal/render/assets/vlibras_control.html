<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #fff;
    }
  </style>
</head>
<body data-state="booting">
  <iframe id="player" src="/unity/index.html"></iframe>
  <script>
    const player = document.querySelector("#player");
    const send = (method, params) => player.contentWindow.postMessage({
      type: "unity", object: "PlayerManager", method, params
    }, "*");
    window.configureVlibras = (dictionaryUrl, avatar) => {
      send("setBaseUrl", dictionaryUrl);
      send("Change", avatar);
      send("setSubtitlesState", 0);
    };
    window.startGloss = (gloss) => send("playNow", gloss);
    window.addEventListener("message", (event) => {
      if (event.source !== player.contentWindow || event.data?.type !== "unity_event") return;
      const { event: name, data } = event.data;
      if (name === "on_load_player") document.body.dataset.state = "loaded";
      if (name === "on_playing_state_change") document.body.dataset.playing = JSON.stringify(data);
      if (name === "counter_gloss") document.body.dataset.counter = JSON.stringify(data);
    });
  </script>
</body>
</html>
